{% extends 'admin_panel/base.html' %}

{% block content %}
<h2>View Users</h2>

<table class="table table-striped mt-4">
    <thead>
        <tr>
            <th>Full Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Joined</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.full_name }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.date_joined|date:"M d, Y" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="text-center">No users registered</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
