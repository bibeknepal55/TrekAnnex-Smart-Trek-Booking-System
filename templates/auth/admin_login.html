<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4">Admin Panel Login</h3>
                        
                        {% if messages %}
                            {% for message in messages %}
                                {% if message.tags == 'success' %}
                                <div class="alert alert-success alert-dismissible fade show">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                                {% endif %}
                            {% endfor %}
                        {% endif %}
                        
                        {% if errors.general %}
                        <div class="alert alert-danger">{{ errors.general }}</div>
                        {% endif %}
                        
                        <form method="post" onsubmit="return false;" id="adminLoginForm">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" class="form-control" name="username" value="{{ username }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label>Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" name="password" id="adminPassword" value="{{ password }}" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('adminPassword', 'toggleIconAdmin')">
                                        <i class="fas fa-eye" id="toggleIconAdmin"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <button type="button" onclick="document.getElementById('adminLoginForm').onsubmit=null; document.getElementById('adminLoginForm').submit();" class="btn btn-primary w-100">Login</button>
                        </form>
                        
                        <script>
                        function togglePassword(fieldId, iconId) {
                            const field = document.getElementById(fieldId);
                            const icon = document.getElementById(iconId);
                            if (field.type === 'password') {
                                field.type = 'text';
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            } else {
                                field.type = 'password';
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            }
                        }
                        </script>
                        
                        <div class="text-center mt-3">
                            <a href="{% url 'home' %}">Back to Website</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
